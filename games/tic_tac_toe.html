  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Outfit', 'Noto Sans TC', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    
    /* Dynamic animated gradients */
    .bg-mesh {
      background: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                  radial-gradient(circle at 90% 80%, rgba(244, 63, 94, 0.15) 0%, transparent 40%),
                  #0f172a;
    }

    /* SVG Stroke draw animations */
    .draw-x-1 {
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: drawLine 0.28s ease-out forwards;
    }
    .draw-x-2 {
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: drawLine 0.28s ease-out 0.14s forwards;
    }
    .draw-o {
      stroke-dasharray: 260;
      stroke-dashoffset: 260;
      animation: drawLine 0.35s ease-out forwards;
    }
    @keyframes drawLine {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* Subtle board cell hover & scale */
    .cell-btn {
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .cell-btn:active {
      transform: scale(0.96);
    }

    /* Pulse effect on active turn */
    @keyframes subtlePulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); }
      50% { transform: scale(1.03); box-shadow: 0 0 16px 2px rgba(99, 102, 241, 0.3); }
    }
    .active-turn {
      animation: subtlePulse 2s infinite;
    }

    /* Confetti canvas */
    #confettiCanvas {
      pointer-events: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 50;
    }

    .footer {
      margin-top: 16px;
      margin-bottom: 8px;
      text-align: center;
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: 500;
      line-height: 1.5;
    }
  </style>
</head>

  <script>
    // --- Web Audio Synthesizer (Zero external dependencies) ---
    class SoundFX {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playMove(isX = true) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = isX ? 'triangle' : 'sine';
        const freq = isX ? 440 : 587.33; // A4 vs D5
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.3, this.ctx.currentTime + 0.08);

        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.12);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.12);
      }
      playWin() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C-E-G-C chord
        notes.forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = freq;
          const startTime = this.ctx.currentTime + i * 0.08;
          gain.gain.setValueAtTime(0.18, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.35);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + 0.35);
        });
      }
      playDraw() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(320, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.25);
      }
    }

    const sound = new SoundFX();

    class ConfettiEffect {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.particles = [];
        this.animId = null;
        this.resize();
        window.addEventListener('resize', () => this.resize());
      }
      resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
      }
      fire() {
        const colors = ['#38bdf8', '#818cf8', '#fb7185', '#facc15', '#4ade80'];
        this.particles = [];
        for (let i = 0; i < 90; i++) {
          this.particles.push({
            x: this.canvas.width * 0.5,
            y: this.canvas.height * 0.45,
            vx: (Math.random() - 0.5) * 16,
            vy: (Math.random() - 0.7) * 18,
            size: Math.random() * 8 + 4,
            color: colors[Math.floor(Math.random() * colors.length)],
            rotation: Math.random() * 360,
            rotationSpeed: (Math.random() - 0.5) * 10,
            opacity: 1,
            decay: Math.random() * 0.015 + 0.008
          });
        }
        if (!this.animId) {
          this.update();
        }
      }
      update() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        let active = false;
        for (let p of this.particles) {
          if (p.opacity > 0) {
            active = true;
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.4; // gravity
            p.vx *= 0.98;
            p.rotation += p.rotationSpeed;
            p.opacity -= p.decay;

            this.ctx.save();
            this.ctx.translate(p.x, p.y);
            this.ctx.rotate((p.rotation * Math.PI) / 180);
            this.ctx.globalAlpha = Math.max(0, p.opacity);
            this.ctx.fillStyle = p.color;
            this.ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
            this.ctx.restore();
          }
        }
        if (active) {
          this.animId = requestAnimationFrame(() => this.update());
        } else {
          cancelAnimationFrame(this.animId);
          this.animId = null;
          this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        }
      }
    }

    function updateTurnUI() {
      if (isGameOver) return;

      const isX = currentPlayer === 'X';
      const oName = gameMode === 'pve' ? '電腦 (AI)' : '玩家 O';

      turnMessage.textContent = isX ? '輪到 玩家 X 下棋' : `輪到 ${oName} 下棋`;

      if (isX) {
        cardPlayerX.className = 'relative bg-slate-900/90 border-2 border-cyan-500/80 rounded-2xl p-3 flex flex-col items-center justify-center active-turn transition-all duration-300';
        cardPlayerO.className = 'relative bg-slate-900/40 border border-slate-800 rounded-2xl p-3 flex flex-col items-center justify-center transition-all duration-300';
        indicatorX.className = 'w-2 h-2 rounded-full bg-cyan-400 mt-1 shadow-[0_0_8px_#22d3ee]';
        indicatorO.className = 'w-2 h-2 rounded-full bg-transparent mt-1';
      } else {
        cardPlayerO.className = 'relative bg-slate-900/90 border-2 border-rose-500/80 rounded-2xl p-3 flex flex-col items-center justify-center active-turn transition-all duration-300';
        cardPlayerX.className = 'relative bg-slate-900/40 border border-slate-800 rounded-2xl p-3 flex flex-col items-center justify-center transition-all duration-300';
        indicatorO.className = 'w-2 h-2 rounded-full bg-rose-400 mt-1 shadow-[0_0_8px_#fb7185]';
        indicatorX.className = 'w-2 h-2 rounded-full bg-transparent mt-1';
      }

      btnUndo.disabled = moveHistory.length === 0 || (gameMode === 'pve' && currentPlayer === 'O');
    }

    function renderCell(index, player) {
      const cell = cells[index];
      cell.innerHTML = player === 'X' ? X_SVG : O_SVG;
      cell.classList.remove('cursor-pointer');
      cell.classList.add('cursor-default');
    }

    function checkWinner(state) {
      for (let i = 0; i < WINNING_COMBOS.length; i++) {
        const [a, b, c] = WINNING_COMBOS[i];
        if (state[a] && state[a] === state[b] && state[a] === state[c]) {
          return { winner: state[a], comboIndex: i, cells: [a, b, c] };
        }
      }
      if (state.every(cell => cell !== null)) {
        return { winner: 'Tie' };
      }
      return null;
    }

    function handleMove(index) {
      if (boardState[index] !== null || isGameOver) return;

      boardState[index] = currentPlayer;
      moveHistory.push({ index, player: currentPlayer });
      renderCell(index, currentPlayer);
      sound.playMove(currentPlayer === 'X');

      const result = checkWinner(boardState);

      if (result) {
        handleGameEnd(result);
      } else {
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        updateTurnUI();

        // If PvE mode and it's O's turn (AI)
        if (gameMode === 'pve' && currentPlayer === 'O' && !isGameOver) {
          triggerAIMove();
        }
      }
    }

    function drawWinningLine(comboIndex) {
      const coords = LINE_COORDINATES[comboIndex];
      winningLine.setAttribute('x1', coords.x1);
      winningLine.setAttribute('y1', coords.y1);
      winningLine.setAttribute('x2', coords.x2);
      winningLine.setAttribute('y2', coords.y2);
      winningLine.style.strokeDashoffset = '400';
      winningLineSvg.classList.remove('hidden');

      setTimeout(() => {
        winningLine.style.strokeDashoffset = '0';
      }, 20);
    }

    function handleGameEnd(result) {
      isGameOver = true;
      btnUndo.disabled = true;

      if (result.winner === 'Tie') {
        scores.ties++;
        scoreTiesElem.textContent = scores.ties;
        turnMessage.textContent = '雙方平手！';
        sound.playDraw();
        showResultModal('tie');
      } else {
        const isX = result.winner === 'X';
        if (isX) scores.X++; else scores.O++;
        scoreXElem.textContent = scores.X;
        scoreOElem.textContent = scores.O;

        drawWinningLine(result.comboIndex);

        // Highlight cells
        result.cells.forEach(idx => {
          cells[idx].classList.add('ring-2', isX ? 'ring-cyan-400' : 'ring-rose-400', 'bg-slate-800');
        });

        sound.playWin();
        confetti.fire();

        setTimeout(() => {
          showResultModal(result.winner);
        }, 600);
      }
    }

    function showResultModal(outcome) {
      if (outcome === 'tie') {
        modalTitle.textContent = '平手和局！';
        modalSubtitle.textContent = '勢均力敵，不相上下！';
        modalIconContainer.className = 'w-16 h-16 mx-auto mb-3 flex items-center justify-center rounded-2xl bg-amber-500/20 text-amber-400';
        modalIconContainer.innerHTML = `
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 12h8m-8-4h8m-8 8h8" /></svg>
        `;
      } else {
        const isX = outcome === 'X';
        const isPvE = gameMode === 'pve';
        const winnerName = isX ? '玩家 X' : (isPvE ? '電腦 AI' : '玩家 O');

        modalTitle.textContent = `${winnerName} 獲得勝利！`;
        modalSubtitle.textContent = isX ? '策略高超，連成一線！' : (isPvE ? '被不敗演算法擊潰了，再挑戰一次吧！' : '技高一籌，精彩絕倫！');
        modalIconContainer.className = `w-16 h-16 mx-auto mb-3 flex items-center justify-center rounded-2xl ${isX ? 'bg-cyan-500/20 text-cyan-400' : 'bg-rose-500/20 text-rose-400'}`;
        modalIconContainer.innerHTML = isX
          ? `<svg class="w-9 h-9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>`
          : `<svg class="w-9 h-9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="8" /></svg>`;
      }

      resultModal.classList.remove('opacity-0', 'pointer-events-none');
      modalCard.classList.remove('scale-90');
      modalCard.classList.add('scale-100');
    }

    function closeModal() {
      resultModal.classList.add('opacity-0', 'pointer-events-none');
      modalCard.classList.remove('scale-100');
      modalCard.classList.add('scale-90');
    }

    function triggerAIMove() {
      // Disable cell taps while AI thinking
      cells.forEach(c => c.style.pointerEvents = 'none');
      turnMessage.textContent = '電腦思考中...';

      const delay = Math.random() * 260 + 240;

      setTimeout(() => {
        if (isGameOver) return;
        let chosenIndex;

        if (aiDifficulty === 'easy') {
          chosenIndex = getRandomMove();
        } else if (aiDifficulty === 'medium') {
          // 65% optimal, 35% random
          chosenIndex = Math.random() < 0.65 ? getBestMove() : getRandomMove();
        } else {
          // Hard: Unbeatable Minimax
          chosenIndex = getBestMove();
        }

        cells.forEach(c => c.style.pointerEvents = 'auto');
        if (chosenIndex !== undefined && chosenIndex !== null) {
          handleMove(chosenIndex);
        }
      }, delay);
    }

    function getRandomMove() {
      const available = boardState.map((val, idx) => val === null ? idx : null).filter(val => val !== null);
      if (available.length === 0) return null;
      return available[Math.floor(Math.random() * available.length)];
    }

    function getBestMove() {
      // Minimax algorithm where AI is 'O' (maximizing) and human is 'X' (minimizing)
      let bestScore = -Infinity;
      let move = null;

      for (let i = 0; i < 9; i++) {
        if (boardState[i] === null) {
          boardState[i] = 'O';
          let score = minimax(boardState, 0, false);
          boardState[i] = null;
          if (score > bestScore) {
            bestScore = score;
            move = i;
          }
        }
      }
      return move !== null ? move : getRandomMove();
    }

    function minimax(state, depth, isMaximizing) {
      const res = checkWinner(state);
      if (res) {
        if (res.winner === 'O') return 10 - depth;
        if (res.winner === 'X') return depth - 10;
        if (res.winner === 'Tie') return 0;
      }

      if (isMaximizing) {
        let best = -Infinity;
        for (let i = 0; i < 9; i++) {
          if (state[i] === null) {
            state[i] = 'O';
            best = Math.max(best, minimax(state, depth + 1, false));
            state[i] = null;
          }
        }
        return best;
      } else {
        let best = Infinity;
        for (let i = 0; i < 9; i++) {
          if (state[i] === null) {
            state[i] = 'X';
            best = Math.min(best, minimax(state, depth + 1, true));
            state[i] = null;
          }
        }
        return best;
      }
    }

    function restartRound() {
      closeModal();
      boardState = Array(9).fill(null);
      moveHistory = [];
      isGameOver = false;
      currentPlayer = 'X';

      winningLineSvg.classList.add('hidden');
      winningLine.style.strokeDashoffset = '400';

      cells.forEach(cell => {
        cell.innerHTML = '';
        cell.classList.remove('ring-2', 'ring-cyan-400', 'ring-rose-400', 'bg-slate-800');
        cell.classList.add('cursor-pointer');
        cell.classList.remove('cursor-default');
        cell.style.pointerEvents = 'auto';
      });

      updateTurnUI();
    }

    function undoMove() {
      if (moveHistory.length === 0 || isGameOver) return;

      if (gameMode === 'pve') {
        // In PvE, undo both the AI's move and player's move
        if (moveHistory.length >= 2) {
          const aiStep = moveHistory.pop();
          boardState[aiStep.index] = null;
          cells[aiStep.index].innerHTML = '';

          const playerStep = moveHistory.pop();
          boardState[playerStep.index] = null;
          cells[playerStep.index].innerHTML = '';

          currentPlayer = 'X';
        } else if (moveHistory.length === 1) {
          const step = moveHistory.pop();
          boardState[step.index] = null;
          cells[step.index].innerHTML = '';
          currentPlayer = 'X';
        }
      } else {
        // PvP undo 1 step
        const lastStep = moveHistory.pop();
        boardState[lastStep.index] = null;
        cells[lastStep.index].innerHTML = '';
        currentPlayer = lastStep.player;
      }

      updateTurnUI();
    }

    function resetScores() {
      scores.X = 0;
      scores.O = 0;
      scores.ties = 0;
      scoreXElem.textContent = '0';
      scoreOElem.textContent = '0';
      scoreTiesElem.textContent = '0';
      restartRound();
    }

    cells.forEach((cell, idx) => {
      cell.addEventListener('click', () => {
        if (gameMode === 'pve' && currentPlayer === 'O') return;
        handleMove(idx);
      });
    });

    btnRestart.addEventListener('click', restartRound);
    btnUndo.addEventListener('click', undoMove);
    btnResetScore.addEventListener('click', resetScores);
    modalActionBtn.addEventListener('click', restartRound);

    // Mode Switchers
    modePvPBtn.addEventListener('click', () => {
      if (gameMode === 'pvp') return;
      gameMode = 'pvp';
      modePvPBtn.className = 'py-2 px-3 text-sm font-semibold rounded-xl transition-all duration-200 bg-indigo-600 text-white shadow-md shadow-indigo-600/30';
      modePvEBtn.className = 'py-2 px-3 text-sm font-semibold rounded-xl transition-all duration-200 text-slate-400 hover:text-white hover:bg-slate-800/60';
      aiDifficultyContainer.classList.add('hidden');
      labelPlayerO.textContent = '玩家 O';
      restartRound();
    });

    modePvEBtn.addEventListener('click', () => {
      if (gameMode === 'pve') return;
      gameMode = 'pve';
      modePvEBtn.className = 'py-2 px-3 text-sm font-semibold rounded-xl transition-all duration-200 bg-indigo-600 text-white shadow-md shadow-indigo-600/30';
      modePvPBtn.className = 'py-2 px-3 text-sm font-semibold rounded-xl transition-all duration-200 text-slate-400 hover:text-white hover:bg-slate-800/60';
      aiDifficultyContainer.classList.remove('hidden');
      labelPlayerO.textContent = '電腦 (AI)';
      restartRound();
    });

    // Difficulty Switchers
    diffButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        aiDifficulty = btn.getAttribute('data-level');
        diffButtons.forEach(b => {
          b.className = 'diff-btn py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition';
        });
        btn.className = 'diff-btn py-1.5 text-xs font-bold rounded-lg bg-rose-600/30 text-rose-400 border border-rose-500/40 transition';
        restartRound();
      });
    });

    // Sound toggle
    soundToggleBtn.addEventListener('click', () => {
      sound.muted = !sound.muted;
      soundIconOn.classList.toggle('hidden', sound.muted);
      soundIconOff.classList.toggle('hidden', !sound.muted);
    });

    // Initialize display
    updateTurnUI();

    const currentYear = new Date().getFullYear();
    const yearEl = document.getElementById("year");
    if (yearEl) yearEl.textContent = Math.max(2026, currentYear);
  </script>
</body>
